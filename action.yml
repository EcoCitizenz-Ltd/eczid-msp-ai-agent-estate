name: "ECZ-ID MSP AI & Agent Estate"
description: "Inventory AI-agent, MCP, plugin and workflow authority surfaces across MSP-managed customer estates."
author: EcoCitizenz Ltd
branding:
  icon: shield
  color: green
inputs:
  path:
    description: "Repository-relative path to inspect."
    required: false
    default: "."
  client-id:
    description: "Optional customer identifier recorded locally; never sent to ECZ-ID."
    required: false
  output:
    description: "Repository-relative JSON report path."
    required: false
    default: "eczid-msp-ai-agent-estate.json"
  fail-on:
    description: "invalid or never. Missing identity never fails the Action."
    required: false
    default: "invalid"
outputs:
  result-state:
    description: "NO_AI_AGENT_SURFACES, AI_AGENT_ESTATE_OBSERVED, REVIEW_RECOMMENDED, or INVALID_INPUT."
    value: ${{ steps.delegate.outputs['result-state'] }}
  surface-count:
    description: "Number of supported AI/agent/MCP/plugin/workflow observations."
    value: ${{ steps.delegate.outputs['surface-count'] }}
  identity-reference-count:
    description: "Number of ECZ-ID/Resolver references observed."
    value: ${{ steps.delegate.outputs['identity-reference-count'] }}
  report-path:
    description: "Generated JSON report path."
    value: ${{ steps.delegate.outputs['report-path'] }}
  next-action-url:
    description: "One contextual free or managed-accountability next step."
    value: ${{ steps.delegate.outputs['next-action-url'] }}
runs:
  using: composite
  steps:
    - id: delegate
      uses: EcoCitizenz-Ltd/eczid-msp-machine-trust-toolkit/actions/ai-agent-estate@fedb5cb7633e7cf74c952291a7fbe302e5333af6
      with:
        path: ${{ inputs['path'] }}
        client-id: ${{ inputs['client-id'] }}
        output: ${{ inputs['output'] }}
        fail-on: ${{ inputs['fail-on'] }}
